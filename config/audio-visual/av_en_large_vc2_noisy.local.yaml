train_name: whisper
audio_max_length: 240000
text_max_length: 350
accelerator: auto
weight_decay: 0.01
adam_epsilon: 1.0e-8
num_worker: 16
validate_every_n_batches: 1000
num_devices: 1

model_name: large-v2
learning_rate: 1.0e-4
batch_size: 16
num_train_steps: 20000
warmup_steps: 5000
gradient_accumulation_steps: 1

monitor: val_noisy_en_babble/acc_av
noise_prob: 1.0
noise_snr_train: 0
noise_fn: noise/musan/tsv/all/train.tsv
noise_fn_val: noise/babble/lrs3/valid.tsv
noise_fn_test: noise/babble/lrs3/test.tsv

video_model_ckpt: models/large_noise_pt_noise_ft_433h_only_weights.pt
freeze_video_model: true
freeze_video_batch_norm_stats: false
spec_augment: ls-basic
dropout_rate: 0

lang: en
vc2: true
vc2_path: en_vc2
pt_ckpt: models/checkpoint/whisper_en_large_vc2_noisy/last.ckpt
resume_training: false
train_id: whisper-flamingo_en_large_vc2_noisy

video_projection_train_only: false
video_projection_separate_lr: ''
prob_use_av: 1.0
prob_use_a: 0.0
use_av_hubert_encoder: true
add_gated_x_attn: 1
av_fusion: separate

data_root: /root/group-shared/voiceprint/data/multimodal/multimodal/audio-visual/derived/avsr_reproduction/muavic_wf_v1
whisper_download_root: /root/.cache/whisper
log_output_dir: slurm/train_video_slurm
check_output_dir: models/checkpoint
